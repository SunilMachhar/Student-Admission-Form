
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>College Admission Form</h1>

    <form id="admissionForm">

        <label>Student Name</label>
        <input type="text" name="studentName" placeholder="Enter Student Name">
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <label>Mobile Number:</label>
        <input type="tel" name="mobileNumber" minlength="10" maxlength="10" pattern="[0-9]{10}" required>
        <br><br>

        <label>Father's Name:</label>
        <input type="text" name="fathersName" placeholder="Enter father's name" required>
        <br><br>

        <label>Mother's Name:</label>
        <input type="text" name="MothersName" placeholder="Enter mother's name" required>
        <br><br>

        <label>City:</label>
        <input type="text" name="City" placeholder="Enter your city" required>
        <br><br>

        <label>Pin Code:</label>
        <input type="number" name="PinCode" placeholder="Enter pin code" required>
        <br><br>

        <label>Address:</label>
        <textarea name="Address" placeholder="Enter your address" required></textarea>
        <br><br>


        <label>Date of Birth:</label>
        <input type="date" name="DateOfBirth">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Male" required> Male
        <input type="radio" name="gender" value="Female" required> Female
        <br><br>
        <label>Course:</label>
        <select name="course">
            <option>Select Course</option>
            <option>BCA</option>
            <option>BBA</option>
            <option>B.Tech</option>
            <option>MCA</option>
            </select>  

        <label for="department">Department:</label>

        <select id="department" name="department">
            <option value="">Select Department</option>
            <option value="cs">Computer Science</option>
            <option value="management">Management</option>
            <option value="it">Information Technology</option>
        </select>
        <br><br>
        <br><br>

        <label>10th Percentage:</label>
        <input type="number" name="tenthPercentage" placeholder="Enter 10th percentage" min="33" max="100">
        <br><br>

        <label>12th Percentage:</label>
        <input type="number" name="twelfthPercentage" placeholder="Enter 12th percentage" min="33" max="100">
        <br><br>
        <label>Student Category:</label>
        <select name="category">
            <option>Select Category</option>
            <option>General</option>
            <option>OBC</option>
            <option>SC</option>
            <option>ST</option>
        </select>
        <br><br>
        <label>Upload Your Photo:</label>
        <input type="file" name="photo" accept="image/*">
        <br><br>

        <label>Upload 10th Marksheet:</label>
        <input type="file" name="tenthMarksheet" accept=".pdf,image/*">
        <br><br>

        <label>Upload 12th Marksheet:</label>
        <input type="file" name="twelfthMarksheet" accept=".pdf,image/*">
        <br><br>
        <br><br>

        <input type="checkbox" id="terms" required>
        <label for="terms">
            I agree to the Terms and Conditions
        </label>

        <br><br>

        
        <button type="submit">Submit</button>
    <br><br>
<hr>

<p>© 2026 College Admission Portal</p>
<p>All Rights Reserved</p>
</form>
<script src="script.js"></script>
</body>
</html>
